services:
  - type: redis
    name: testwise-redis
    plan: free

  - type: web
    name: testwise-worker
    rootDir: .
    buildCommand: npm install && npx prisma generate
    startCommand: npm run worker
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: testwise-redis
          property: connectionString
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: eu-north-1
      - key: S3_BUCKET_NAME
        value: elkris-blog
      - key: NODE_ENV
        value: production