<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1100" height="550" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">Document Processing Pipeline</text>
  <text x="550" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Upload → Extract → Store → Query → Respond</text>
  
  <!-- Step 1: Upload -->
  <rect x="50" y="100" width="150" height="80" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="50" y="100" width="150" height="25" rx="10" fill="#4f46e5"/>
  <text x="125" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">1. UPLOAD</text>
  <text x="125" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">PDF/DOCX/TXT</text>
  <text x="125" y="162" text-anchor="middle" font-family="Courier New, monospace" font-size="9" fill="#6b7280">Max 50MB</text>
  
  <!-- Arrow -->
  <path d="M200 140 L250 140" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Step 2: S3 Storage -->
  <rect x="250" y="100" width="150" height="80" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <rect x="250" y="100" width="150" height="25" rx="10" fill="#ea580c"/>
  <text x="325" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">2. S3 STORAGE</text>
  <text x="325" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">uploads/{userId}/</text>
  <text x="325" y="162" text-anchor="middle" font-family="Courier New, monospace" font-size="9" fill="#6b7280">{uuid}-{file}</text>
  
  <!-- Arrow -->
  <path d="M400 140 L450 140" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Step 3: Redis Queue -->
  <rect x="450" y="100" width="150" height="80" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="450" y="100" width="150" height="25" rx="10" fill="#dc2626"/>
  <text x="525" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">3. QUEUE</text>
  <text x="525" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">BullMQ Job</text>
  <text x="525" y="162" text-anchor="middle" font-family="Courier New, monospace" font-size="9" fill="#6b7280">document-processing</text>
  
  <!-- Arrow -->
  <path d="M600 140 L650 140" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Step 4: Worker -->
  <rect x="650" y="100" width="150" height="80" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <rect x="650" y="100" width="150" height="25" rx="10" fill="#0891b2"/>
  <text x="725" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">4. WORKER</text>
  <text x="725" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">Extract Text</text>
  <text x="725" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">PDF.js / Mammoth</text>
  
  <!-- Arrow -->
  <path d="M800 140 L850 140" stroke="#0891b2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Step 5: Store -->
  <rect x="850" y="100" width="180" height="80" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <rect x="850" y="100" width="180" height="25" rx="10" fill="#059669"/>
  <text x="940" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">5. STORE</text>
  <text x="940" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">Document.content</text>
  <text x="940" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">status: READY</text>
  
  <!-- Timing boxes -->
  <rect x="50" y="200" width="980" height="50" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="540" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">⏱️ Total Processing Time: ~2-5 seconds (vs 5+ minutes with chunking)</text>
  
  <!-- Chat Flow Section -->
  <text x="550" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Chat with Document Flow</text>
  
  <!-- Step A: User Query -->
  <rect x="50" y="320" width="160" height="90" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="50" y="320" width="160" height="25" rx="10" fill="#4f46e5"/>
  <text x="130" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">A. USER QUERY</text>
  <text x="130" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">"What is the main</text>
  <text x="130" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">topic of chapter 2?"</text>
  
  <!-- Arrow -->
  <path d="M210 365 L250 365" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Step B: API + LLM -->
  <rect x="250" y="320" width="160" height="90" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="250" y="320" width="160" height="25" rx="10" fill="#d97706"/>
  <text x="330" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">B. LLM PROCESS</text>
  <text x="330" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">System: doc content</text>
  <text x="330" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">User: question</text>
  
  <!-- Arrow -->
  <path d="M410 365 L450 365" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Step C: Stream Response -->
  <rect x="450" y="320" width="160" height="90" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <rect x="450" y="320" width="160" height="25" rx="10" fill="#0891b2"/>
  <text x="530" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">C. STREAM</text>
  <text x="530" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">Token-by-token</text>
  <text x="530" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">real-time display</text>
  
  <!-- Arrow -->
  <path d="M610 365 L650 365" stroke="#0891b2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Step D: Save to DB -->
  <rect x="650" y="320" width="160" height="90" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <rect x="650" y="320" width="160" height="25" rx="10" fill="#059669"/>
  <text x="730" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">D. SAVE</text>
  <text x="730" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">DocumentMessage</text>
  <text x="730" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">conversation updated</text>
  
  <!-- Arrow -->
  <path d="M810 365 L850 365" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Step E: Response -->
  <rect x="850" y="320" width="180" height="90" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="850" y="320" width="180" height="25" rx="10" fill="#4f46e5"/>
  <text x="940" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">E. RESPONSE</text>
  <text x="940" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">Full answer from</text>
  <text x="940" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">document content</text>
  
  <!-- Comparison Box -->
  <rect x="50" y="440" width="980" height="80" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="70" y="465" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Comparison: Old vs New Approach</text>
  
  <rect x="70" y="475" width="440" height="35" rx="6" fill="#fee2e2"/>
  <text x="90" y="497" font-family="Arial, sans-serif" font-size="10" fill="#991b1b">❌ OLD: Chunk + Embed → Vector Search → LLM → Response</text>
  <text x="90" y="510" font-family="Arial, sans-serif" font-size="9" fill="#b91c1c">10,000 chunks • ~5 min processing • Complex infrastructure</text>
  
  <rect x="530" y="475" width="480" height="35" rx="6" fill="#dcfce7"/>
  <text x="550" y="497" font-family="Arial, sans-serif" font-size="10" fill="#166534">✓ NEW: Direct LLM → Streaming Response</text>
  <text x="550" y="510" font-family="Arial, sans-serif" font-size="9" fill="#15803d">Full doc sent • ~2-5 sec processing • Simple</text>
</svg>